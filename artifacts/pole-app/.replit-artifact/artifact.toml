kind = "web"
previewPath = "/"
title = "Utility Pole Engineering Challenge"
version = "1.0.0"
id = "artifacts/pole-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25696

[services.development]
run = "pnpm --filter @workspace/pole-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pole-app", "run", "build" ]
publicDir = "artifacts/pole-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25696"
BASE_PATH = "/"
